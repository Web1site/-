<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Educational Courses">
    <meta name="keywords" content="Courses, Education">

    <title>Courses</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #e4dbdb;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h2 {
            margin: 0;
            font-size: 24px;
        }

        main {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
            text-align: center;
        }

        main h1 {
            font-size: clamp(25px, 5vw, 36px);
            margin-bottom: 35px;
        }

        .course {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
        }

        .course h2 {
            font-size: clamp(21px, 4vw, 30px);
            margin-top: 0;
        }

        hr {
            border: none;
            border-top: 1px solid #444;
            margin: 20px 0;
        }

        .review {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 8px;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            margin-top: 30px;
            border-top: 1px solid #333;
            color: #888;
            font-size: 14px;
        }

        /* Mobile screens */
        @media (max-width: 600px) {
            header {
                padding: 16px;
            }

            header h2 {
                font-size: 21px;
            }

            main {
                padding: 25px 14px;
            }

            main h1 {
                margin-bottom: 25px;
            }

            .course {
                padding: 18px 12px;
                border-radius: 9px;
            }

            .review {
                font-size: 16px;
            }

            footer {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main>

        <h1>Welcome to Our Website</h1>

        <section class="course">

            <h2>physics</h2>

            <hr>

            <p class="review">flux</p>

            <div class="video-container">
                <iframe
                    src="https://drive.google.com/file/d/1dBu4NtjJLXdq_9NQa82vyR0j8pN0yYhW/preview"
                    allow="autoplay; fullscreen"
                    allowfullscreen
                    loading="lazy">
                </iframe>
            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026. All rights reserved.</p>
    </footer>

</body>
</html>
