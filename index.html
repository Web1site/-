<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Educational Physics Content">
    <meta name="keywords" content="Physics">

    <title>Physics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #e4dbdb;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        main {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 10px;
            text-align: center;
        }

        .course {
            background-color: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            width: 100%;
        }

        .course h2 {
            font-size: clamp(21px, 4vw, 30px);
            margin: 5px 0 15px;
        }

        hr {
            border: none;
            border-top: 1px solid #444;
            margin: 15px 0;
        }

        .review {
            font-size: 18px;
            margin: 15px 0;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 6px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        footer {
            text-align: center;
            padding: 20px 10px;
            margin-top: 20px;
            border-top: 1px solid #333;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            main {
                padding: 4px;
            }

            .course {
                padding: 10px 4px;
                border-radius: 5px;
            }

            .course h2 {
                font-size: 22px;
            }

            .review {
                font-size: 16px;
            }

            .video-container {
                width: 100%;
                aspect-ratio: 16 / 9;
                border-radius: 3px;
            }

            footer {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <main>

        <section class="course">

            <h2>Physics</h2>

            <hr>

            <p class="review">Flux</p>

            <div class="video-container">

                <iframe
                    src="https://drive.google.com/file/d/1dBu4NtjJLXdq_9NQa82vyR0j8pN0yYhW/preview"
                    allow="autoplay; fullscreen"
                    allowfullscreen
                    webkitallowfullscreen
                    mozallowfullscreen
                    loading="lazy">
                </iframe>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026. All rights reserved.</p>
    </footer>

</body>
</html>
